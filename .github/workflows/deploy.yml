# Build, check and publish the static site to GitHub Pages (https://mollyelizabethbrown.github.io).
#
# Runs on: every push to main · manual "Run workflow" · called by content-from-issue.yml after a
# content form adds a publication or news item.
#
# Before publishing it validates the content database (references, metadata, privacy), type-checks,
# builds, and crawls the built site for broken internal links and images. Any failure stops the deploy
# and the previous version stays online.
#
# One-time repository setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Optional repository variable: ALLOW_INDEXING = true once Dr. Brown approves the launch.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: https://mollyelizabethbrown.github.io
      NEXT_PUBLIC_ALLOW_INDEXING: ${{ vars.ALLOW_INDEXING || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # always build the latest main (also when called right after a content commit)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate content and publication metadata
        run: npm run check:content
      - name: Type check
        run: npm run typecheck
      - name: Build static site
        run: npm run build
      - name: Check links and images in the built site
        run: |
          npm run serve:out > /tmp/serve.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          npm run check:site -- http://localhost:4173
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
